<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資訊設備換機歷史儀表板</title>
<script src="/js/vue.global.prod.js"></script>
<script src="/js/chart.umd.min.js"></script>
<script src="/js/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f0f6fa;
    --panel: #ffffff;
    --border: #d2e4f0;
    --ink: #2b3e4f;
    --ink-soft: #5b758c;
    --ink-faint: #8da6bc;
    --header: #1f3b54;
    --accent: #2e86ab;
    --accent-soft: #e1f1f9;
    --good: #56ab91;
    --warn: #e29b56;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}

  header.top{
    background:var(--header);
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:3px solid var(--accent);
  }
  header.top .title-block{display:flex; flex-direction:column; gap:4px;}
  header.top .title-row{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--accent); color:#fff; font-weight:800; font-size:12px;
    padding:4px 12px; border-radius:999px; letter-spacing:2px;
    box-shadow:0 0 0 1px rgba(255,255,255,.25) inset;
  }
  header.top h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.2px;}
  header.top .sub{font-size:12.5px; color:#b0cce0; font-family:var(--mono);}
  header.top .actions{display:flex; gap:8px; flex-wrap:wrap;}

  .btn{
    appearance:none; border:1px solid var(--border); background:var(--panel); color:var(--ink);
    padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:.15s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:#236b8a; color:#fff;}
  .btn.ghost{background:transparent; border-color:rgba(255,255,255,.25); color:#fff;}
  .btn.ghost:hover{background:rgba(255,255,255,.1); color:#fff; border-color:#fff;}
  .btn.small{padding:5px 10px; font-size:12px;}
  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  label.btn{margin:0;}
  .import-toast{
    margin:0 28px; margin-top:10px; padding:10px 16px; border-radius:8px; font-size:13px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .import-toast.success{background:#e5f6f0; color:#3d8a6f; border:1px solid #bce6d5;}
  .import-toast.error{background:#fcf0f2; color:#b85c6b; border:1px solid #f2cbd1;}
  .import-toast.info{background:var(--accent-soft); color:var(--accent); border:1px solid #b8dfef;}

  nav.tabs{
    display:flex; gap:2px; padding:0 28px; background:var(--panel); border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  nav.tabs button{
    appearance:none; border:none; background:transparent; padding:14px 16px; font-size:14px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap;
  }
  nav.tabs button.active{color:var(--accent); border-bottom-color:var(--accent);}
  nav.tabs button:hover{color:var(--ink);}

  main{flex:1; padding:22px 28px 60px; max-width:1400px; width:100%; margin:0 auto;}

  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
  .kpi{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px;
    box-shadow:0 2px 6px rgba(46,134,171,0.04);
  }
  .kpi .label{font-size:12.5px; color:var(--ink-faint); font-weight:600;}
  .kpi .value{font-size:26px; font-weight:800; margin-top:6px; font-family:var(--mono); color:var(--header);}
  .kpi .value.small{font-size:15px; font-family:var(--sans); font-weight:700;}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px;
    margin-bottom:20px; box-shadow:0 2px 6px rgba(46,134,171,0.04);
  }
  .panel h2{font-size:15px; margin:0 0 4px; font-weight:800; color:var(--header);}
  .panel .desc{font-size:12.5px; color:var(--ink-faint); margin-bottom:14px;}

  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .panel-head h2{margin:0;}

  .filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
  .filters select, .filters input[type=text], .filters input[type=date]{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; font-family:var(--sans);
    background:#f7fbfe; color:var(--ink);
  }
  .filters input[type=text]{min-width:200px;}
  .chip-group{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600;
    cursor:pointer; background:#f7fbfe; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px;
  }
  .chip .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

  .chart-wrap{position:relative; height:340px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint);
    border-bottom:1.5px solid var(--border); padding:8px 10px; white-space:nowrap; cursor:pointer; user-select:none;
    background:#f7fbfe;
  }
  thead th:hover{color:var(--accent);}
  tbody td{padding:9px 10px; border-bottom:1px solid #e7f1f7; vertical-align:top;}
  tbody tr:hover{background:#f0f6fa;}
  .mono{font-family:var(--mono); font-size:12.5px;}
  .tag{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700;
  }
  .table-scroll{overflow-x:auto;}
  .empty-row{text-align:center; color:var(--ink-faint); padding:30px !important;}

  .diff-line{font-size:12px; margin-bottom:2px;}
  .diff-line .f{color:var(--ink-faint); font-weight:600;}
  .diff-line .old{color:#b85c6b; text-decoration:line-through; font-family:var(--mono);}
  .diff-line .new{color:#3d8a6f; font-weight:700; font-family:var(--mono);}
  .arrow{color:var(--ink-faint); margin:0 3px;}

  .group-cat-block{margin-bottom:18px;}
  .group-cat-title{
    display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; margin-bottom:8px; padding-bottom:6px;
    border-bottom:2px solid var(--border); color:var(--header);
  }
  .group-item{border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden;}
  .group-item-head{
    display:flex; align-items:center; justify-content:space-between; padding:11px 14px; cursor:pointer; gap:10px;
    background:#f7fbfe;
  }
  .group-item-head:hover{background:#edf4f8;}
  .group-item-head .name{font-family:var(--mono); font-weight:700; font-size:13px;}
  .group-item-head .meta{display:flex; gap:14px; align-items:center; font-size:12px; color:var(--ink-faint);}
  .group-item-body{padding:12px 16px; border-top:1px solid var(--border);}
  .chev{transition:.15s; color:var(--ink-faint);}
  .chev.open{transform:rotate(90deg);}
  .badge-count{
    background:var(--accent-soft); color:var(--accent); font-weight:800; border-radius:999px; padding:2px 9px; font-size:11.5px;
  }
  .badge-count.zero{background:#e7f1f7; color:var(--ink-faint);}

  .risk-tag{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
  .risk-tag.risk-high{background:#fcf0f2; color:#b85c6b;}
  .risk-tag.risk-mid{background:#fcf4ec; color:#b87d3a;}
  .risk-tag.risk-low{background:#e5f6f0; color:#3d8a6f;}
  .source-tag{font-size:11px; color:var(--ink-faint); font-weight:600;}
  .capacity-line{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .capacity-bar{flex:1; background:#e7f1f7; border-radius:999px; height:7px; overflow:hidden; max-width:220px;}
  .capacity-bar-fill{height:100%; background:var(--accent); border-radius:999px;}
  .capacity-bar-fill.over{background:#b85c6b;}
  .week-block{border:1px solid var(--border); border-radius:10px; margin-bottom:10px; overflow:hidden;}
  .week-head{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 16px; cursor:pointer; background:#f7fbfe; flex-wrap:wrap;}
  .week-head:hover{background:#edf4f8;}
  .week-head .wk-name{font-weight:800; font-size:13.5px; font-family:var(--mono);}
  .week-body{padding:12px 16px; border-top:1px solid var(--border);}
  .pager{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-soft); margin-top:10px; flex-wrap:wrap;}
  .pager .btn.small[disabled]{opacity:.4; cursor:not-allowed;}
  .standard-note{font-size:12px; color:var(--ink-faint); margin-top:8px; line-height:1.7;}

  .timeline{border-left:2px solid var(--border); margin-left:6px; padding-left:16px;}
  .timeline-item{position:relative; padding-bottom:14px;}
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-item::before{
    content:''; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--accent);
    border:2px solid #fff; box-shadow:0 0 0 1.5px var(--accent);
  }
  .timeline-date{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink);}
  .timeline-remark{font-size:12px; color:var(--warn); font-weight:700; margin-left:8px;}

  .audit-loc-block{border:1px solid var(--border); border-radius:12px; margin-bottom:20px; overflow:hidden; background:var(--panel);}
  .audit-loc-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:12px 16px; background:#f4f9fc; border-bottom:1px solid var(--border);
  }
  .audit-loc-head h3{margin:0; font-size:14.5px; font-weight:800; color:var(--header); display:flex; align-items:center; gap:8px;}
  .audit-loc-head .desc{font-size:12px; color:var(--ink-faint);}
  .audit-loc-body{padding:12px 16px;}
  .audit-cat-title{font-size:12.5px; font-weight:800; color:var(--ink-soft); margin:10px 0 6px; display:flex; align-items:center; gap:6px;}
  table.audit-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:16px;}
  table.audit-table th{
    text-align:left; font-size:11.5px; color:var(--ink-faint); font-weight:700;
    border-bottom:1px solid var(--border); padding:6px 8px; white-space:nowrap; position:sticky; top:0; background:var(--panel);
  }
  table.audit-table td{padding:6px 8px; border-bottom:1px solid #eef4f8; vertical-align:middle;}
  table.audit-table tr.audit-row-checked{background:#f3f9f6;}
  table.audit-table tr.audit-row-flagged{background:#fdf2f3;}
  table.audit-table tr.audit-row-flagged.audit-row-checked{background:#fbf3ec;}
  .audit-note-input{
    width:100%; min-width:110px; font-size:12px; padding:4px 6px; border:1px solid var(--border);
    border-radius:6px; font-family:var(--sans); background:var(--panel); color:var(--ink);
  }
  .audit-flag{display:inline-flex; align-items:flex-start; gap:4px; padding:3px 8px; border-radius:8px; background:#fcf0f2; color:#b85c6b; font-size:11px; font-weight:700; margin:1px 0;}
  .audit-who{font-size:11px; color:var(--ink-faint);}
  .audit-empty{font-size:12.5px; color:var(--ink-faint); padding:10px 0;}
  .audit-checkbox{width:16px; height:16px; cursor:pointer;}

  .code-block{
    background:#1f2a33; color:#d8e6ee; font-family:var(--mono); font-size:13px;
    padding:14px 16px; border-radius:10px; overflow-x:auto; white-space:pre; line-height:1.6;
    position:relative;
  }
  .code-copy-btn{position:absolute; top:8px; right:8px;}
  .step-num{
    display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
    border-radius:50%; background:var(--accent); color:#fff; font-size:12px; font-weight:800; margin-right:8px; flex:none;
  }
  .step-row{display:flex; align-items:flex-start; gap:4px; margin-bottom:14px;}
  .step-body{flex:1;}
  .step-title{font-weight:800; font-size:13.5px; color:var(--header); margin-bottom:6px;}
  .git-drop{
    border:2px dashed var(--border); border-radius:12px; padding:26px 16px; text-align:center;
    background:#fbfdfe; cursor:pointer; transition:.15s;
  }
  .git-drop:hover, .git-drop.dragover{border-color:var(--accent); background:var(--accent-soft);}
  .git-drop .hint{font-size:12px; color:var(--ink-faint); margin-top:6px;}
  .git-file-card{
    border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-top:12px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--panel);
  }
  .git-file-info{font-size:12.5px; color:var(--ink-soft); line-height:1.7;}
  .git-file-info b{color:var(--header);}
  .git-file-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .git-history-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:8px 10px; border-bottom:1px solid #eef4f8; font-size:12.5px;
  }
  .git-history-item:last-child{border-bottom:none;}

  footer.foot{padding:20px 28px 40px; text-align:center; color:var(--ink-faint); font-size:12px;}

  .report-summary-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:18px;}
  .report-summary-grid .cell{border:1px solid var(--border); border-radius:8px; padding:10px 12px; background:#f7fbfe;}
  .report-summary-grid .cell .l{font-size:11.5px; color:var(--ink-faint);}
  .report-summary-grid .cell .v{font-size:18px; font-weight:800; font-family:var(--mono); color:var(--header);}

  @media print{
    header.top, nav.tabs, .no-print{display:none !important;}
    body{background:#fff;}
    main{max-width:100%; padding:0;}
    .panel{border:none; box-shadow:none; padding:0; margin-bottom:24px;}
    .chart-wrap{height:280px;}
  }

  @media (max-width: 720px){
    header.top{padding:14px 16px;}
    main{padding:16px 16px 50px;}
    .filters{flex-direction:column; align-items:stretch;}
  }
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="title-block">
      <div class="title-row">
        <span class="brand-mark">比漾</span>
        <h1>資訊設備換機歷史儀表板</h1>
      </div>
      <span class="sub">資料期間 {{ dataset.summary.dateRange[0] || '—' }} ~ {{ dataset.summary.dateRange[1] || '—' }}　最後同步：{{ dataset.summary.lastCommitDate || '—' }}</span>
    </div>
    <div class="actions no-print">
      <label class="btn ghost" for="gitLogFileInput">匯入 Git Log</label>
      <input id="gitLogFileInput" ref="fileInput" type="file" class="visually-hidden" accept=".txt,.log,.diff,text/plain" @change="onFileUpload">
      <button class="btn ghost" @click="downloadDatasetJSON">下載資料 (JSON)</button>
      <button class="btn primary" @click="downloadExcel">匯出 Excel 報表</button>
    </div>
  </header>

  <div v-if="importStatus" class="import-toast no-print" :class="importStatus.type">
    <span>{{ importStatus.message }}</span>
    <button class="btn small" @click="importStatus=null">關閉</button>
  </div>

  <nav class="tabs no-print">
    <button :class="{active: tab==='dashboard'}" @click="tab='dashboard'">儀表板</button>
    <button :class="{active: tab==='groups'}" @click="tab='groups'">分類機台清單</button>
    <button :class="{active: tab==='events'}" @click="tab='events'">換機事件明細</button>
    <button :class="{active: tab==='forecast'}" @click="tab='forecast'">換機建議與故障預測</button>
    <button :class="{active: tab==='audit'}" @click="tab='audit'">查核比對／防盜稽核</button>
    <button :class="{active: tab==='gitexport'}" @click="tab='gitexport'">最新 Git Log 匯出</button>
    <button :class="{active: tab==='report'}" @click="tab='report'">列印報表</button>
  </nav>

  <main>

    <!-- ============ DASHBOARD ============ -->
    <template v-if="tab==='dashboard'">
      <div class="kpi-row">
        <div class="kpi">
          <div class="label">機台總數</div>
          <div class="value">{{ dataset.summary.totalTerminals }}</div>
        </div>
        <div class="kpi">
          <div class="label">設備分類數</div>
          <div class="value">{{ dataset.summary.totalCategories }}</div>
        </div>
        <div class="kpi">
          <div class="label">累計換機 / 異動事件</div>
          <div class="value">{{ dataset.summary.totalEvents }}</div>
        </div>
        <div class="kpi">
          <div class="label">目前篩選事件數</div>
          <div class="value" style="color:var(--accent)">{{ filteredEvents.length }}</div>
        </div>
        <div class="kpi">
          <div class="label">在庫存機台</div>
          <div class="value" style="color:var(--ink-soft)">{{ stockStats.inStock }}</div>
        </div>
        <div class="kpi">
          <div class="label">無櫃位（公用）機台</div>
          <div class="value" style="color:#b9793a">{{ stockStats.noCounter }}</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>歷史換機趨勢圖</h2>
            <div class="desc">依分類統計每期換機 / 異動事件數量</div>
          </div>
          <div class="filters" style="margin:0;">
            <select v-model="granularity">
              <option value="day">依日</option>
              <option value="week">依週</option>
              <option value="month">依月</option>
            </select>
            <select v-model="chartType">
              <option value="bar">堆疊長條圖</option>
              <option value="line">趨勢折線圖</option>
            </select>
          </div>
        </div>
        <div class="chip-group" style="margin-bottom:14px;">
          <span class="chip" :class="{active: selectedCategories.length===0}" @click="selectedCategories=[]">
            全部分類
          </span>
          <span class="chip" v-for="c in dataset.categories" :key="c"
                :class="{active: selectedCategories.includes(c)}"
                :style="selectedCategories.includes(c) ? {borderColor: catColor(c), color: catColor(c), background: catColor(c)+'1a'} : {}"
                @click="toggleCategory(c)">
            <span class="dot" :style="{background: catColor(c)}"></span>{{ c }}
          </span>
        </div>
        <div class="chart-wrap">
          <canvas ref="trendCanvas"></canvas>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>庫存與櫃位狀態統計</h2>
            <div class="desc">依分類統計目前使用中（有櫃位）、無櫃位（公用）、在庫存的機台數量</div>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>分類</th>
                <th>使用中（有櫃位）</th>
                <th>無櫃位（公用）</th>
                <th>在庫存</th>
                <th>機台總數</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="row in stockBreakdown" :key="row.category">
                <td><span class="tag" :style="tagStyle(row.category)">{{ row.category }}</span></td>
                <td class="mono">{{ row.assigned }}</td>
                <td class="mono" style="color:#b9793a">{{ row.noCounter }}</td>
                <td class="mono" style="color:var(--ink-soft)">{{ row.inStock }}</td>
                <td class="mono">{{ row.total }}</td>
              </tr>
              <tr>
                <td><b>總計</b></td>
                <td class="mono"><b>{{ stockStats.assigned }}</b></td>
                <td class="mono" style="color:#b9793a"><b>{{ stockStats.noCounter }}</b></td>
                <td class="mono" style="color:var(--ink-soft)"><b>{{ stockStats.inStock }}</b></td>
                <td class="mono"><b>{{ dataset.summary.totalTerminals }}</b></td>
              </tr>
            </tbody>
          </table>
        </div>

            <input type="checkbox" v-model="auditOnlyPending"> 只顯示未盤點／異常
          </label>
          <button class="btn small" @click="exportAuditExcel">匯出稽核報表</button>
          <button class="btn small" style="border-color:#b85c6b; color:#b85c6b;" @click="clearAuditForDate">清空本日盤點紀錄</button>
        </div>

        <div v-for="loc in auditLocationOrder" :key="loc" class="audit-loc-block" v-show="!auditLocationFilter || auditLocationFilter===loc">
          <div class="audit-loc-head">
            <h3>{{ locationMeta[loc].icon }} {{ locationMeta[loc].label }}
              <span style="color:var(--ink-faint); font-weight:600; font-size:12px;">
                （{{ Object.values(auditGrouped[loc]).reduce((s,arr)=>s+arr.length,0) }} 台）
              </span>
            </h3>
            <div class="desc">{{ locationMeta[loc].desc }}</div>
          </div>
          <div class="audit-loc-body">
            <div v-if="Object.keys(auditGrouped[loc]).length===0" class="audit-empty">目前篩選條件下，此分組沒有機台。</div>
            <template v-for="cat in dataset.categories" :key="cat">
              <template v-if="auditGrouped[loc][cat] && auditGrouped[loc][cat].length">
                <div class="audit-cat-title">
                  <span class="dot" :style="{background: catColor(cat), width:'8px', height:'8px', borderRadius:'50%', display:'inline-block'}"></span>
                  {{ cat }}（{{ auditGrouped[loc][cat].length }} 台）
                </div>
                <div style="overflow-x:auto;">
                  <table class="audit-table">
                    <thead>
                      <tr>
                        <th>盤點</th>
                        <th>機號</th>
                        <th>型號描述</th>
                        <th>櫃號</th>
                        <th>機號(設備)</th>
                        <th>商戶代碼</th>
                        <th>狀態/櫃位</th>
                        <th>倉庫庫存</th>
                        <th>累計換機</th>
                        <th>最近換機日</th>
                        <th>最後同步</th>
                        <th>異常旗標</th>
                        <th>盤點人／時間</th>
                        <th>異動備註</th>
                        <th>盤點備註</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-for="t in auditGrouped[loc][cat]" :key="t.groupKey"
                          :class="{ 'audit-row-checked': getAuditRecord(t).checked, 'audit-row-flagged': auditFlags(t).length>0 }">
                        <td><input type="checkbox" class="audit-checkbox" :checked="getAuditRecord(t).checked" @change="toggleAuditCheck(t)"></td>
                        <td class="mono">{{ t.terminalId }}
                          <div v-if="replacementExclusionLabel(t)" style="color:#b85c6b; font-size:11px; font-weight:700; margin-top:2px;" :title="'不列入換機計算：'+replacementExclusionLabel(t)">🚫 {{ replacementExclusionLabel(t) }}</div>
                        </td>
                        <td>{{ t.assetDescription || '—' }}</td>
                        <td class="mono">{{ t.counterNo || '—' }}</td>
                        <td class="mono">{{ t.machineNo || '—' }}</td>
                        <td class="mono">{{ t.merchantCode || '—' }}</td>
                        <td>{{ t.assetStatus || '—' }}</td>
                        <td>{{ t.warehouseStock ? '是' : '否' }}</td>
                        <td class="mono">{{ t.changeCount }}</td>
                        <td class="mono">{{ t.lastChangeDate || '—' }}</td>
                        <td class="mono">{{ t.lastCommitDate || '—' }}</td>
                        <td>
                          <div v-for="(f,i) in auditFlags(t)" :key="i" class="audit-flag">⚠ {{ f }}</div>
                          <span v-if="auditFlags(t).length===0" style="color:var(--ink-faint);">—</span>
                        </td>
                        <td class="audit-who">
                          <template v-if="getAuditRecord(t).checked">
                            {{ getAuditRecord(t).by || '（未填姓名）' }}<br>{{ (getAuditRecord(t).at||'').replace('T',' ').slice(0,16) }}
                          </template>
                          <template v-else>—</template>
                        </td>
                        <td style="max-width:220px; white-space:normal; font-size:12px; color:var(--ink-soft);">{{ allRemarks(t) || '—' }}</td>
                        <td>
                          <input type="text" class="audit-note-input" :value="getAuditRecord(t).note"
                                 @change="updateAuditNote(t, $event.target.value)" placeholder="備註…">
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </template>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- ============ GIT LOG EXPORT ============ -->
    <template v-if="tab==='gitexport'">
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>最新 Git Log 匯出</h2>
            <div class="desc">
              產生本系統可讀取的最新換機紀錄檔，並自動依「處理當下的系統時間」重新命名，方便留存每一次匯出的版本、避免互相覆蓋。
            </div>
          </div>
        </div>

        <div class="step-row">
          <span class="step-num">1</span>
          <div class="step-body">
            <div class="step-title">在有這個 git 倉庫的機器上，執行以下指令</div>
            <div class="code-block" id="gitCmdBlock">git log -p --unified=15 --no-merges -- terminals/*.json &gt; out15.txt<button class="btn small ghost code-copy-btn" style="color:var(--ink-soft); border-color:var(--border);" @click="copyGitCommand">{{ gitCmdCopied ? '已複製 ✓' : '複製指令' }}</button></div>
            <div class="hint" style="font-size:12px; color:var(--ink-faint); margin-top:6px;">
              會產生一個 <code class="mono">out15.txt</code>，內容是 <code class="mono">terminals/</code> 目錄下所有 <code class="mono">*.json</code> 異動（含新增、修改、刪除）的 diff（含前後各 15 行上下文，足以完整涵蓋每筆機台 JSON 與備註內容，且排除合併提交）。若您的 shell 會展開 <code class="mono">*</code>（例如 bash／zsh），效果相同；若擔心展開行為不一致，也可以自行改成 <code class="mono">'terminals/*.json'</code>（單引號讓 git 自己處理 glob）。
            </div>
          </div>
        </div>

        <div class="step-row">
          <span class="step-num">2</span>
          <div class="step-body" style="width:100%;">
            <div class="step-title">把產生的 out15.txt 拖進來，或點擊選取檔案</div>
            <div class="git-drop"
                 :class="{dragover: gitDropActive}"
                 @click="$refs.gitExportFileInput.click()"
                 @dragover.prevent="gitDropActive=true"
                 @dragleave.prevent="gitDropActive=false"
                 @drop.prevent="onGitExportDrop">
              <div style="font-size:14px; font-weight:700; color:var(--header);">📄 拖放 out15.txt 到這裡，或點擊選取檔案</div>
              <div class="hint">支援一次處理多個檔案；每個檔案會各自依處理時間重新命名。</div>
            </div>
            <input ref="gitExportFileInput" type="file" class="visually-hidden" multiple accept=".txt,.log,.diff,text/plain" @change="onGitExportSelect">
          </div>
        </div>

        <template v-if="gitExportFiles.length">
          <div class="step-row" style="margin-top:4px;">
            <span class="step-num">3</span>
            <div class="step-body" style="width:100%;">
              <div class="step-title">下載重新命名後的檔案</div>
              <div v-for="f in gitExportFiles" :key="f.id" class="git-file-card">
                <div class="git-file-info">
                  原始檔名：<b>{{ f.originalName }}</b>　|　檔案大小：{{ f.sizeLabel }}　|　行數：{{ f.lineCount }}<br>
                  處理時間：<span class="mono">{{ f.processedAt }}</span>　|　偵測到 terminals diff 區塊：{{ f.diffBlockCount }} 個<br>
                  建議新檔名：<b class="mono" style="color:var(--accent);">{{ f.newName }}</b>
                </div>
                <div class="git-file-actions">
                  <button class="btn small primary" @click="downloadGitExportFile(f)">下載（{{ f.newName }}）</button>
                  <button class="btn small ghost" style="color:var(--ink-soft); border-color:var(--border);" @click="importGitExportFile(f)">同時套用為最新資料集</button>
                </div>
              </div>
            </div>
          </div>
        </template>

        <div v-if="gitExportHistory.length" style="margin-top:22px; border-top:1px solid var(--border); padding-top:14px;">
          <div class="step-title" style="margin-bottom:4px;">本次瀏覽階段的處理紀錄</div>
          <div class="hint" style="margin-bottom:6px;">僅保存於目前分頁的瀏覽階段中，重新整理頁面後會清空；如需長期留存，請自行下載檔案保存。</div>
          <div>
            <div v-for="h in gitExportHistory" :key="h.id" class="git-history-item">
              <span>{{ h.processedAt }}　→　<b class="mono">{{ h.newName }}</b>（原檔：{{ h.originalName }}，{{ h.sizeLabel }}）</span>
              <button class="btn small ghost" style="color:var(--ink-soft); border-color:var(--border);" @click="redownloadGitExportHistory(h)">重新下載</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ============ REPORT ============ -->
    <template v-if="tab==='report'">
      <div class="panel">
        <div class="panel-head no-print">
          <div>
            <h2>列印報表</h2>
            <div class="desc">套用目前「換機事件明細」篩選條件產生的正式報表格式，可直接列印或另存 PDF</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn primary" @click="printReport">列印 / 另存 PDF</button>
            <button class="btn" @click="downloadExcel">匯出 Excel</button>
          </div>
        </div>

        <div>
          <h2 style="font-size:18px;">資訊設備換機歷史報表</h2>
          <div style="font-size:12.5px; color:var(--ink-faint); margin-bottom:16px;">
            報表產生時間：{{ nowStr }}　篩選條件：{{ reportFilterDesc }}
          </div>

          <div class="report-summary-grid">
            <div class="cell"><div class="l">機台總數</div><div class="v">{{ dataset.summary.totalTerminals }}</div></div>
            <div class="cell"><div class="l">設備分類數</div><div class="v">{{ dataset.summary.totalCategories }}</div></div>
            <div class="cell"><div class="l">篩選後事件數</div><div class="v">{{ sortedFilteredEvents.length }}</div></div>
            <div class="cell"><div class="l">資料期間</div><div class="v" style="font-size:13px;">{{ dataset.summary.dateRange[0] }} ~ {{ dataset.summary.dateRange[1] }}</div></div>
          </div>

          <h2 style="font-size:14px; margin-top:24px;">分類統計</h2>
          <table style="margin-bottom:20px;">
            <thead><tr><th>分類</th><th>機台數</th><th>累計換機次數</th></tr></thead>
            <tbody>
              <tr v-for="c in dataset.categories" :key="c">
                <td><span class="tag" :style="tagStyle(c)">{{ c }}</span></td>
                <td>{{ (groupedAllTerminals[c]||[]).length }}</td>
                <td>{{ (groupedAllTerminals[c]||[]).reduce((s,t)=>s+t.changeCount,0) }}</td>
              </tr>
            </tbody>
          </table>

          <h2 style="font-size:14px;">換機事件清單</h2>
          <table>
            <thead>
              <tr><th>日期</th><th>分類</th><th>分類_機號</th><th>備註</th><th>欄位異動</th></tr>
            </thead>
            <tbody>
              <tr v-for="ev in sortedFilteredEvents" :key="ev.id">
                <td class="mono">{{ ev.date }}</td>
                <td>{{ ev.category }}</td>
                <td class="mono">{{ ev.groupKey }}</td>
                <td>{{ ev.remark || '—' }}</td>
                <td>
                  <div class="diff-line" v-for="(c,i) in ev.changes" :key="i">
                    {{ c.label }}：{{ c.oldValue || '(空)' }} → {{ c.newValue || '(空)' }}
                  </div>
                </td>
              </tr>
              <tr v-if="sortedFilteredEvents.length===0"><td colspan="5" class="empty-row">無資料</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </template>

  </main>

/* ---------------------------------------------------------------
   已知主檔欄位集（可動態擴充 / 可由外部覆寫）
---------------------------------------------------------------- */
const DEFAULT_KNOWN_TOP_KEYS = [
  'terminalId','category','assetDescription','counterNo','machineNo',
  'merchantCode','assetStatus','warehouseStock','sourceFile'
];

// 事件結構鍵：這些鍵屬於 entries[] 內，第一遍收集機台主檔欄位時必須跳過
const EVENT_STRUCTURAL_KEYS = new Set([
  'date','operator','action','field','oldValue','newValue','remark','commitId'
]);

// terminal 物件上由程式碼自行維護的欄位（匯出 extraFields 時要排除）
const TERMINAL_INTERNAL_KEYS = new Set([
  'terminalId','category','groupKey','assetDescription','counterNo','machineNo',
  'merchantCode','assetStatus','warehouseStock','sourceFile',
  'lastCommitDate','changeCount','lastChangeDate',
  'commitHash','commitDate','commitDateISO','_sort','_present','entries'
]);

/* ---------------------------------------------------------------
   主檔頂層欄位判斷：縮排 ≤ 2（tab 視為 2 空格）
   ─ terminals/*.json 結構：
       {
         "counterNo": null,          ← 縮排 2，主檔
         ...
         "entries": [
           {
             "date": "...",          ← 縮排 6+
             "changes": [
               { "field": "counterNo", ... }  ← 縮排 10+
             ]
           }
         ]
       }
---------------------------------------------------------------- */
function isTopLevelFieldLine(line){
  const m = line.match(/^(\s*)/);
  if(!m) return false;
  const indent = m[1].replace(/\t/g,'  ').length;
  return indent <= 2;
}

/* ---------------------------------------------------------------
   Git Log 解析器
---------------------------------------------------------------- */
function parseGitLogText(text, options){
  options = options || {};
  const KNOWN_TOP_KEYS = (Array.isArray(options.knownKeys) && options.knownKeys.length)
    ? options.knownKeys.slice()
    : DEFAULT_KNOWN_TOP_KEYS.slice();
  const KNOWN_TOP_KEY_SET = new Set(KNOWN_TOP_KEYS);

  const unknownFields = new Set();
  const skippedFiles = []; // 記錄被丟棄的 diff（例如混入多 terminalId）

  const lines = text.split(/\r\n|\r|\n/);
  const commitRe = /^commit ([0-9a-fA-F]+)/;
  const dateRe = /^Date:\s*(.*)/;
  const diffRe = /^diff --git a\/(\S+) b\/(\S+)/;

  let curCommitHash=null, curCommitDate=null, curFilePath=null;
  let contextPlus=[], plusOnly=[];
  const records=[];

  function parseVal(v){
  v = v.trim().replace(/,$/,'');
  if(v==='null') return null;
  if(v==='true') return true;
  if(v==='false') return false;

  // 去除字串引號
  let s = v;
  if(s.startsWith('"') && s.endsWith('"') && s.length>=2) s = s.slice(1,-1);
  else if(s.startsWith('"')) s = s.slice(1);

  // 「明確清空」的多種寫法，一律視為 null
  // 註：'N/A' 是 2026-09 之後資料來源改用的空值表示法
  if(s === 'N/A' || s === 'n/a' || s === 'NA' || s === 'na' || s === '') return null;

  return s;
  }

  function flushFile(){
    if(curFilePath===null) return;
    if(!curFilePath.startsWith('terminals/') || !curFilePath.endsWith('.json')){
      curFilePath=null; contextPlus=[]; plusOnly=[]; return;
    }
    const tidFromPath = curFilePath.split('/').pop().replace('.json','');
    const top={}; const seen=new Set();
    let mainTerminalIdCount = 0;

    // ── 第一遍：只收「縮排 ≤ 2」的主檔頂層欄位 ─────────────────
    for(const ln of contextPlus){
      if(!isTopLevelFieldLine(ln)) continue;   // ← 關鍵：跳過 entries 內的同名欄位
      const m = ln.match(/^\s*"(\w+)"\s*:\s*(.*?)\s*$/);
      if(!m) continue;
      const key=m[1], val=m[2];
      if(seen.has(key)) continue;
      if(EVENT_STRUCTURAL_KEYS.has(key)) continue;
      if(val.startsWith('[') || val.startsWith('{')) continue;
      top[key]=parseVal(val);
      seen.add(key);
      if(key === 'terminalId') mainTerminalIdCount++;
      if(!KNOWN_TOP_KEY_SET.has(key)) unknownFields.add(key);
    }

    // 若同一份 diff 中出現多個 terminalId → 丟棄，避免污染
    if(mainTerminalIdCount > 1){
      console.warn('[parseGitLogText] diff 混入多個 terminalId，已丟棄：', curFilePath, top.terminalId);
      skippedFiles.push(curFilePath);
      curFilePath=null; contextPlus=[]; plusOnly=[]; return;
    }

    // ── 第二遍：解析 entries[] ─────────────────────────────────
    const entries=[]; let curEntry=null, pending=null;
    for(const ln of contextPlus){
      const m = ln.match(/^\s*"(\w+)"\s*:\s*(.*?)\s*$/);
      if(!m) continue;
      const key=m[1], val=m[2];
      if(key==='date'){
        if(curEntry) entries.push(curEntry);
        curEntry={date:parseVal(val),operator:null,action:null,changes:[],remark:null,commitId:null};
      } else if(key==='operator'){ if(curEntry) curEntry.operator=parseVal(val); }
      else if(key==='action'){ if(curEntry) curEntry.action=parseVal(val); }
      else if(key==='field'){ pending={field:parseVal(val),oldValue:null,newValue:null}; if(curEntry) curEntry.changes.push(pending); }
      else if(key==='oldValue'){ if(pending) pending.oldValue=parseVal(val); }
      else if(key==='newValue'){ if(pending) pending.newValue=parseVal(val); }
      else if(key==='remark'){ if(curEntry) curEntry.remark=parseVal(val); }
      else if(key==='commitId'){ if(curEntry) curEntry.commitId=parseVal(val); }
    }
    if(curEntry) entries.push(curEntry);

    records.push({
      ...top,
      commitHash:curCommitHash,
      commitDate:curCommitDate,
      terminalId: top.terminalId || tidFromPath,
      entries,
      // _present：這次 diff「實際帶到」的主檔欄位鍵集合，即使值是 null 也算帶到。
      // 補值（fill）邏輯要用這個來判斷缺值，而不是用值本身是否為 null／''，
      // 否則會把「這次明確清空」誤判成「這次沒帶到」，反而拿舊值把新的清空蓋回去。
      _present: new Set(seen)
    });
    curFilePath=null; contextPlus=[]; plusOnly=[];
  }

  for(const raw of lines){
    let m;
    if((m=commitRe.exec(raw))){ flushFile(); curCommitHash=m[1]; curCommitDate=null; continue; }
    if(curCommitDate===null && (m=dateRe.exec(raw))){ curCommitDate=m[1].trim(); continue; }
    if((m=diffRe.exec(raw))){ flushFile(); curFilePath=m[2]; continue; }
    if(curFilePath!==null){
      if(raw.startsWith('+++')||raw.startsWith('---')) continue;
      if(raw.startsWith('+')){ const c=raw.slice(1); contextPlus.push(c); plusOnly.push(c); }
      else if(raw.startsWith('-')){ /* skip removed lines */ }
      else if(raw.startsWith('@@')){ /* hunk header */ }
      else { contextPlus.push(raw.startsWith(' ') ? raw.slice(1) : raw); }
    }
  }
  flushFile();

  const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  function parseCommitDate(s){
    const m = s.match(/^\w+\s+(\w+)\s+(\d+)\s+(\d+):(\d+):(\d+)\s+(\d+)/);
    if(!m) return null;
    const [,mon,day,hh,mm,ss,yyyy]=m;
    if(!(mon in MONTHS)) return null;
    return new Date(Number(yyyy), MONTHS[mon], Number(day), Number(hh), Number(mm), Number(ss));
  }
  records.forEach(r=>{
    const dt = r.commitDate ? parseCommitDate(r.commitDate) : null;
    r._sort = dt ? dt.getTime() : 0;
    r.commitDateISO = dt ? dt.toISOString().slice(0,19).replace('T',' ') : null;
  });
  records.sort((a,b)=>a._sort-b._sort);

  // ── 跨 commit 補值：對所有主檔欄位做 forward / backward fill ─────
  // 關鍵：只有「該 record 這次 diff 完全沒帶到這個鍵」(不在 _present 內) 才是缺值，
  //       要用前後鄰近的已知值遞補。只要這次 diff 有明確帶到（seen/_present），
  //       就是當下最新、最權威的值——即使值是 null（代表明確清空，例如撤櫃、撤機），
  //       也絕對不能被舊值蓋掉，否則會出現「明明剛清空，卻顯示舊櫃號/機號」的錯誤。
  const FILLABLE_KEYS = [
    'category','assetDescription','counterNo','machineNo',
    'merchantCode','assetStatus','warehouseStock','sourceFile'
  ];

  const byTerminal={};
  records.forEach((r,i)=>{ (byTerminal[r.terminalId]=byTerminal[r.terminalId]||[]).push(i); });

  for(const tid in byTerminal){
    const idxs = byTerminal[tid];

    // forward fill
    const lastVal = {};
    for(const i of idxs){
      const r = records[i];
      for(const k of FILLABLE_KEYS){
        if(r._present.has(k)){
          lastVal[k] = r[k];
        } else if(k in lastVal){
          r[k] = lastVal[k];
        }
      }
    }

    // backward fill
    const nextVal = {};
    for(let k=idxs.length-1;k>=0;k--){
      const r = records[idxs[k]];
      for(const key of FILLABLE_KEYS){
        if(r._present.has(key)){
          nextVal[key] = r[key];
        } else if(key in nextVal){
          r[key] = nextVal[key];
        }
      }
    }
  }

  const CAT_MAP={'POS':'POS機','台新刷卡機機':'台新刷卡機','悠遊卡機':'悠遊卡刷卡機'};
  function normCat(c){ if(!c) return '未分類'; return CAT_MAP[c] || c; }

  const FIELD_LABEL={
    counterNo:'櫃號',machineNo:'機號',
    '櫃號':'櫃號','機號':'機號',
    '櫃檯編號 (counterNo)':'櫃號','機台編號 (machineNo)':'機號',
    assetStatus:'狀態/櫃位',merchantCode:'商戶代碼',warehouseStock:'庫存狀態',
    sourceFile:'來源檔案',category:'分類',assetDescription:'型號描述'
  };

  records.forEach(r=>{ r.category=normCat(r.category); r.groupKey=r.category+'_'+r.terminalId; });

  // 判斷某個值是否為「空」（null、undefined、空字串、'0'、'N/A'、'NA'）
  function isEmptyChangeValue(v){
    if(v === null || v === undefined) return true;
    const s = String(v).trim();
    if(s === '' || s === '0') return true;
    const upper = s.toUpperCase();
    if(upper === 'N/A' || upper === 'NA') return true;
    return false;
  }

  const events=[]; let eid=0;
  records.forEach(r=>{
    r.entries.forEach(e=>{
      if(!e.date) return;
      const changes=(e.changes||[]).filter(c=>{
        if(!c.field) return false;
        // 若 oldValue 與 newValue 都是「空」（含 N/A → N/A、'' → ''、null → null），
        // 這個 change 沒有實質意義（可能是製表工具留下的佔位符），過濾掉
        if(isEmptyChangeValue(c.oldValue) && isEmptyChangeValue(c.newValue)) return false;
        return true;
      });
      eid++;
      events.push({
        id:eid, groupKey:r.groupKey, category:r.category, terminalId:r.terminalId,
        date:e.date, remark:e.remark||'', operator:e.operator||'',
        changes: changes.map(c=>({
          field:c.field,
          label: FIELD_LABEL[c.field] || c.field,
          oldValue: c.oldValue==null?'':c.oldValue,
          newValue: c.newValue==null?'':c.newValue
        })),
        commitDate:r.commitDateISO
      });
    });
  });

  const byTid={};
  records.forEach(r=>{ (byTid[r.terminalId]=byTid[r.terminalId]||[]).push(r); });
  const terminals=[];
  for(const tid in byTid){
    const rs = byTid[tid].slice().sort((a,b)=>a._sort-b._sort);
    const latest = rs[rs.length-1];
    const hist = events.filter(e=>e.terminalId===tid).sort((a,b)=>a.date.localeCompare(b.date));

    const extraFields = {};
    for(const k in latest){
      if(!Object.prototype.hasOwnProperty.call(latest, k)) continue;
      if(TERMINAL_INTERNAL_KEYS.has(k)) continue;
      extraFields[k] = latest[k];
    }

    terminals.push({
      terminalId:tid, category:latest.category, groupKey:latest.groupKey,
      assetDescription:latest.assetDescription, counterNo:latest.counterNo, machineNo:latest.machineNo,
      merchantCode:latest.merchantCode, assetStatus:latest.assetStatus, warehouseStock:latest.warehouseStock,
      sourceFile:latest.sourceFile, lastCommitDate:latest.commitDateISO,
      changeCount: hist.length, lastChangeDate: hist.length ? hist[hist.length-1].date : null,
      extraFields
    });
  }
  terminals.sort((a,b)=> a.category.localeCompare(b.category) || a.terminalId.localeCompare(b.terminalId));
  events.sort((a,b)=>a.date.localeCompare(b.date));
  const categories=[...new Set(terminals.map(t=>t.category))].sort();
  let lastCommitDate=null;
  records.forEach(r=>{ if(r.commitDateISO && (!lastCommitDate || r.commitDateISO>lastCommitDate)) lastCommitDate=r.commitDateISO; });
  const summary={
    totalTerminals:terminals.length, totalCategories:categories.length, totalEvents:events.length,
    dateRange: events.length ? [events[0].date, events[events.length-1].date] : [null,null],
    lastCommitDate
  };

  return {
    summary, categories, terminals, events,
    unknownFields: [...unknownFields].sort(),
    skippedFiles
  };
}

const { createApp, ref, reactive, computed, watch, onMounted, nextTick } = Vue;

    function bucketKey(dateStr, gran){
      const d = new Date(dateStr+'T00:00:00');
      if(gran==='day') return dateStr;
      if(gran==='month') return dateStr.slice(0,7);
      // week: 以本地時間計算週一，避免 toISOString 的 UTC 位移
      const day = (d.getDay()+6)%7;
      const monday = new Date(d);
      monday.setDate(d.getDate()-day);
      // 用本地日期格式化，不用 toISOString
      const yyyy = monday.getFullYear();
      const mm = String(monday.getMonth()+1).padStart(2,'0');
      const dd = String(monday.getDate()).padStart(2,'0');
      return `${yyyy}-${mm}-${dd}`;
    }

    const topChangedTerminals = computed(()=>{
      let list = dataset.terminals.filter(t=>t.changeCount>0);

      return list.slice().sort((a,b)=> b.changeCount-a.changeCount || (a.lastChangeDate||'').localeCompare(b.lastChangeDate||'')).slice(0,25);
    });

    if(raw === null || raw === undefined) return false;
    const s = String(raw).trim();
    if(s === '' || s === '0') return false;
    // 防禦性：即使資料未經 parseVal 轉換，也要把 'N/A' / 'NA' 視為無效
    const upper = s.toUpperCase();
    if(upper === 'N/A' || upper === 'NA') return false;
    return true;
    }

    function isNoCounter(t){ return t.warehouseStock !== true && !hasValidCounter(t); }

      const inStock = dataset.terminals.filter(isInStock).length;

      if(t.warehouseStock !== true && !hasCounter && !hasMachineNo && !status){

    function persistAuditRecords(){

    function getAuditRecord(t){

      const k = auditKey(t);

      if(next.checked){

    function updateAuditNote(t, val){

    const LONG_IDLE_DAYS = 100;
    function daysSinceLastChange(t, ref_){

    }

    function priorityLabel(p){
      return { 1:'①外部強制通知', 2:'②長期未更換', 3:'③分類平均週期', 4:'④全站平均週期' }[p] || '—';
    }

    const forecastList = computed(()=>{
      const ref_ = referenceDate.value;
      return dataset.terminals
        .filter(t=>!isExcludedFromReplacement(t))   // ← 除外清單：不列入換機計算
        .map(t=>{
          let standardDays, source, priority, baseDate, predictedDate;

          if(forcedPriority[t.terminalId]){
            priority = 1; source = 'forced';
            baseDate = t.lastChangeDate || (t.lastCommitDate ? t.lastCommitDate.slice(0,10) : ref_);
            standardDays = 0;
            predictedDate = ref_;
          } else if(daysSinceLastChange(t, ref_) > LONG_IDLE_DAYS){
            priority = 2; source = 'idle';
            baseDate = t.lastChangeDate || (t.lastCommitDate ? t.lastCommitDate.slice(0,10) : ref_);
            standardDays = daysBetween(baseDate, ref_);
            predictedDate = ref_;
          } else {
            const catStat = categorySampleStats.value[t.category];
            if(catStat && catStat.count>=CATEGORY_SAMPLE_THRESHOLD){
              priority = 3; source = 'category';
              standardDays = Math.max(30, Math.round(catStat.avg));
            } else {
              priority = 4; source = 'global';
              standardDays = Math.max(30, Math.round(globalAvgInterval.value));
            }
            baseDate = t.lastChangeDate || (t.lastCommitDate ? t.lastCommitDate.slice(0,10) : ref_);
            predictedDate = addDays(baseDate, standardDays);
          }

          const daysUntil = daysBetween(ref_, predictedDate);
          const risk = daysUntil<=0 ? 'overdue' : (daysUntil<=30 ? 'soon' : 'normal');
          return { ...t, standardDays, source, priority, baseDate, predictedDate, daysUntil, risk };
        }).sort((a,b)=>
          a.priority-b.priority ||
          a.predictedDate.localeCompare(b.predictedDate) ||
          a.groupKey.localeCompare(b.groupKey)
        );
    });

    const forecastRiskCounts = computed(()=>{
      const c = { overdue:0, soon:0, normal:0 };
      filteredForecastBase.value.forEach(t=>{ c[t.risk]++; });
      return c;
    });

    const forecastPriorityCounts = computed(()=>{
      const c = { 1:0, 2:0, 3:0, 4:0 };
      filteredForecastBase.value.forEach(t=>{ c[t.priority] = (c[t.priority]||0)+1; });
      return c;
    });

    const forecastSearch = ref('');
    const forecastCategoryFilter = ref('');
    const forecastRiskFilter = ref('');
    const filteredForecastBase = computed(()=>{
      const q = forecastSearch.value.trim().toLowerCase();
      return forecastList.value.filter(t=>{
        if(forecastCategoryFilter.value && t.category!==forecastCategoryFilter.value) return false;
        if(forecastRiskFilter.value && t.risk!==forecastRiskFilter.value) return false;
        if(q){
          const hay = [t.terminalId,t.category,t.groupKey].join(' ').toLowerCase();
          if(!hay.includes(q)) return false;
        }
        return true;
      });
    });

    const weeklyCapacity = ref(20);
    const monthlyCapacity = ref(200);
    function monthKeyOf(dateStr){ return dateStr.slice(0,7); }
    const leveledForecast = computed(()=>{
      const wcap = weeklyCapacity.value>0 ? weeklyCapacity.value : 20;
      const mcap = monthlyCapacity.value>0 ? monthlyCapacity.value : 200;
      const sorted = filteredForecastBase.value;
      if(!sorted.length) return [];
      let cursorWeek = mondayOf(sorted[0].predictedDate < referenceDate.value ? sorted[0].predictedDate : referenceDate.value);
      let countInWeek = 0;
      const monthCounts = {};
      const result = [];
      for(const item of sorted){
        while(true){
          const mKey = monthKeyOf(cursorWeek);
          if(countInWeek < wcap && (monthCounts[mKey]||0) < mcap) break;
          cursorWeek = addDays(cursorWeek, 7);
          countInWeek = 0;
        }
        countInWeek++;
        const mKey = monthKeyOf(cursorWeek);
        monthCounts[mKey] = (monthCounts[mKey]||0)+1;
        result.push({ ...item, assignedWeek: cursorWeek, queueNo: countInWeek, assignedMonth: mKey });
      }
      return result;
    });

    const weeklyGroups = computed(()=>{
      const map = {};
      leveledForecast.value.forEach(item=>{ (map[item.assignedWeek]=map[item.assignedWeek]||[]).push(item); });
      return Object.keys(map).sort().map(w=>({
        weekStart:w, weekEnd: addDays(w,6), items: map[w], count: map[w].length
      }));
    });

    const monthlyGroups = computed(()=>{
      const map = {};
      leveledForecast.value.forEach(item=>{ (map[item.assignedMonth]=map[item.assignedMonth]||[]).push(item); });
      return Object.keys(map).sort().map(m=>({
        month:m, items: map[m], count: map[m].length
      }));
    });

    const expandedWeeks = reactive(new Set());
    function toggleForecastWeek(w){ expandedWeeks.has(w) ? expandedWeeks.delete(w) : expandedWeeks.add(w); }

    const forecastPage = reactive({});
    const forecastShowAll = reactive(new Set());
    function toggleForecastShowAll(weekStart){
      if(forecastShowAll.has(weekStart)) forecastShowAll.delete(weekStart);
      else forecastShowAll.add(weekStart);
    }
    function forecastWeekPageCount(wk){ return Math.max(1, Math.ceil(wk.count/100)); }
    function forecastWeekPageItems(wk){
      if(forecastShowAll.has(wk.weekStart)) return wk.items;
      const p = forecastPage[wk.weekStart]||0;
      return wk.items.slice(p*100, p*100+100);
    }
    function forecastChangePage(weekStart, delta){
      const cur = forecastPage[weekStart]||0;
      forecastPage[weekStart] = Math.max(0, cur+delta);
    }

    function riskLabel(r){ return r==='overdue' ? '已到期' : (r==='soon' ? '即將到期' : '正常'); }
    function riskClass(r){ return r==='overdue' ? 'risk-high' : (r==='soon' ? 'risk-mid' : 'risk-low'); }
    function sourceLabel(s){
      return s==='forced' ? '外部強制通知' : s==='idle' ? '長期未換(逾100天)' : s==='category' ? '依分類平均' : '依全站平均';
    }

    // ---------- git log export ----------
    const GIT_EXPORT_COMMAND = "git log -p --unified=15 --no-merges -- terminals/*.json > out15.txt";
    const gitCmdCopied = ref(false);
    function copyGitCommand(){
      const done = () => { gitCmdCopied.value = true; setTimeout(()=>{ gitCmdCopied.value = false; }, 1800); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(GIT_EXPORT_COMMAND).then(done).catch(()=>{
          window.prompt('請手動複製以下指令：', GIT_EXPORT_COMMAND);
        });
      }else{
        window.prompt('請手動複製以下指令：', GIT_EXPORT_COMMAND);
      }
    }

    function formatBytes(n){
      if(n < 1024) return n + ' B';
      if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
      return (n/1024/1024).toFixed(2) + ' MB';
    }
    function formatTimestampForFilename(d){
      const pad = x => String(x).padStart(2,'0');
      return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
    }

    const gitDropActive = ref(false);
    const gitExportFiles = reactive([]);
    const gitExportHistory = reactive([]);
    const usedGitExportNames = new Set();
    let gitExportSeq = 0;

    function buildUniqueExportName(d){
      let base = 'out_' + formatTimestampForFilename(d);
      let name = base + '.txt';
      let n = 2;
      while(usedGitExportNames.has(name)){
        name = base + '_' + n + '.txt';
        n++;
      }
      usedGitExportNames.add(name);
      return name;
    }

    function processGitExportFile(file){
      const reader = new FileReader();
      reader.onerror = () => {
        importStatus.value = { type:'error', message:'讀取 '+file.name+' 失敗：'+(reader.error ? reader.error.message : '未知錯誤') };
      };
      reader.onload = () => {
        const text = reader.result;
        const now = new Date();
        const newName = buildUniqueExportName(now);
        const lineCount = (text.match(/\n/g)||[]).length + 1;
        const diffBlockCount = (text.match(/diff --git [^\n]*a\/terminals\//g)||[]).length;
        const blob = new Blob([text], {type:'text/plain'});
        const entry = {
          id: 'ge' + (++gitExportSeq),
          originalName: file.name,
          sizeLabel: formatBytes(file.size),
          lineCount,
          diffBlockCount,
          processedAt: now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '
                       +String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0'),
          newName,
          text,
          blob,
        };
        gitExportFiles.push(entry);
        gitExportHistory.unshift(entry);
      };
      reader.readAsText(file, 'utf-8');
    }

    function onGitExportSelect(evt){
      const files = evt.target.files;
      if(files) Array.from(files).forEach(processGitExportFile);
      evt.target.value = '';
    }
    function onGitExportDrop(evt){
      gitDropActive.value = false;
      const files = evt.dataTransfer && evt.dataTransfer.files;
      if(files) Array.from(files).forEach(processGitExportFile);
    }

    function triggerBlobDownload(blob, filename){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    }
    function downloadGitExportFile(f){ triggerBlobDownload(f.blob, f.newName); }
    function redownloadGitExportHistory(h){ triggerBlobDownload(h.blob, h.newName); }
    function importGitExportFile(f){
      try{
        const parsed = parseGitLogText(f.text);
        if(!parsed.events.length && !parsed.terminals.length){
          importStatus.value = { type:'error', message:'未能從 '+f.originalName+' 解析出任何機台資料，請確認指令與檔案內容正確。' };
          return;
        }
        Object.assign(dataset, parsed);
        expanded.clear();
        expandedWeeks.clear();
        Object.keys(forecastPage).forEach(k=>delete forecastPage[k]);
        forecastShowAll.clear();
        selectedCategories.value = [];
        const baseMsg = '已套用 '+f.newName+' 為最新資料：機台 ' + parsed.summary.totalTerminals +
                        ' 台，換機事件 ' + parsed.summary.totalEvents + ' 筆。';
        importStatus.value = { type:'success', message: baseMsg };
      }catch(err){
        importStatus.value = { type:'error', message:'解析 '+f.originalName+' 失敗：'+err.message };
      }
    }

    // ---------- upload ----------
    const importStatus = ref(null);
    function onFileUpload(evt){
      const file = evt.target.files && evt.target.files[0];
      if(!file){
        importStatus.value = { type:'info', message:'未選取任何檔案。' };
        return;
      }
      importStatus.value = { type:'info', message:'讀取中：'+file.name+' …' };
      const reader = new FileReader();
      reader.onerror = () => {
        importStatus.value = { type:'error', message:'檔案讀取失敗：'+(reader.error ? reader.error.message : '未知錯誤') };
      };
      reader.onload = () => {
        try{
          const parsed = parseGitLogText(reader.result);
          if(!parsed.events.length && !parsed.terminals.length){
            importStatus.value = { type:'error', message:'未能從此檔案解析出任何機台資料，請確認檔案格式為「git log --patch」匯出的文字檔（需包含 terminals/*.json 的 diff 內容）。' };
            return;
          }
          Object.assign(dataset, parsed);
          expanded.clear();
          expandedWeeks.clear();
          Object.keys(forecastPage).forEach(k=>delete forecastPage[k]);
          forecastShowAll.clear();
          selectedCategories.value = [];
          tab.value = 'dashboard';

          let msg = '已成功匯入新資料：機台 ' + parsed.summary.totalTerminals +
                    ' 台，換機事件 ' + parsed.summary.totalEvents +
                    ' 筆（' + (parsed.summary.dateRange[0] || '—') +
                    ' ~ ' + (parsed.summary.dateRange[1] || '—') + '）。';

          const notes = [];
          if(parsed.unknownFields && parsed.unknownFields.length){
            notes.push('⚠ 偵測到 ' + parsed.unknownFields.length +
                       ' 個未定義欄位（已自動收錄至各機台的 extraFields）：' +
                       parsed.unknownFields.join('、'));
          }
          if(parsed.skippedFiles && parsed.skippedFiles.length){
            notes.push('⚠ 有 ' + parsed.skippedFiles.length +
                       ' 個 diff 因混入多個 terminalId 而被丟棄（詳見 console）。');
          }

          if(notes.length){
            importStatus.value = { type:'info', message: msg + '　' + notes.join('　') };
          } else {
            importStatus.value = { type:'success', message: msg };
          }
          console.log('[匯入 Git Log] 成功', parsed.summary, '未知欄位:', parsed.unknownFields, '略過檔案:', parsed.skippedFiles);
        }catch(err){
          console.error('[匯入 Git Log] 解析失敗', err);
          importStatus.value = { type:'error', message:'解析失敗：'+err.message };
        }
      };
      reader.readAsText(file, 'utf-8');
      evt.target.value = '';
    }

    function downloadDatasetJSON(){
      const blob = new Blob([JSON.stringify(dataset, null, 1)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'terminal-history-dataset.json';
      a.click();
    }

    function downloadExcel(){
      const wb = XLSX.utils.book_new();

      const summaryRows = [
        ['機台總數', dataset.summary.totalTerminals],
        ['設備分類數', dataset.summary.totalCategories],
        ['累計換機/異動事件數', dataset.summary.totalEvents],
        ['資料期間(起)', dataset.summary.dateRange[0]],
        ['資料期間(迄)', dataset.summary.dateRange[1]],
        ['最後同步時間', dataset.summary.lastCommitDate],
        ['報表產生時間', nowStr],
        ['套用篩選', reportFilterDesc.value],
      ];
      const ws0 = XLSX.utils.aoa_to_sheet([['項目','數值'], ...summaryRows]);
      XLSX.utils.book_append_sheet(wb, ws0, '摘要');

      const evRows = sortedFilteredEvents.value.map(e=>({
        '日期': e.date,
        '分類': e.category,
        '機號': e.terminalId,
        '分類_機號': e.groupKey,
        '備註': e.remark,
        '欄位異動': e.changes.map(c=>`${c.label}:${c.oldValue||'(空)'}→${c.newValue||'(空)'}`).join('; '),
        '對應Commit時間': e.commitDate,
      }));
      const ws1 = XLSX.utils.json_to_sheet(evRows.length ? evRows : [{'日期':'','分類':'','機號':'','分類_機號':'','備註':'','欄位異動':'','對應Commit時間':''}]);
      XLSX.utils.book_append_sheet(wb, ws1, '換機事件明細');

      const tRows = dataset.terminals.map(t=>({
        '分類': t.category,
        '機號': t.terminalId,
        '分類_機號': t.groupKey,
        '型號描述': t.assetDescription,
        '目前櫃號': t.counterNo,
        '目前機號': t.machineNo,
        '商戶代碼': t.merchantCode,
        '目前狀態/櫃位': t.assetStatus,
        '倉庫庫存': t.warehouseStock ? '是':'否',
        '累計換機次數': t.changeCount,
        '最近換機日期': t.lastChangeDate,
        '最後同步時間': t.lastCommitDate,
        ...(t.extraFields || {}),
      }));
      const ws2 = XLSX.utils.json_to_sheet(tRows);
      XLSX.utils.book_append_sheet(wb, ws2, '機台清單');

      XLSX.writeFile(wb, `換機歷史報表_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    watch([selectedCategories, granularity, chartType, ()=>dataset.events], ()=>{
      nextTick(buildTrendChart);
    }, { deep:true });

    watch(tab, (t)=>{ if(t==='dashboard') nextTick(buildTrendChart); });

    onMounted(()=>{ nextTick(buildTrendChart); loadAuditRecords(auditDate.value); });

    return {
      dataset, tab, fileInput, trendCanvas,
      catColor, tagStyle,
      selectedCategories, granularity, chartType, toggleCategory,
      filteredEvents, topChangedTerminals, sortTop,
      stockStats, stockBreakdown,
      groupSearch, groupCategoryFilter, groupOnlyChanged, expanded, toggleExpand,
      eventsByTerminal, groupedTerminals, groupedAllTerminals, visibleCategoriesForGroups,
      eventSearch, eventCategoryFilter, eventDateFrom, eventDateTo, sortEv, clearEventFilters, sortedFilteredEvents,
      reportFilterDesc, nowStr, printReport,
      referenceDate, globalAvgInterval, categoryStandardTable,
      forecastList, forecastRiskCounts, forecastPriorityCounts, filteredForecastBase,
      forecastSearch, forecastCategoryFilter, forecastRiskFilter,
      weeklyCapacity, monthlyCapacity, weeklyGroups, monthlyGroups, expandedWeeks, toggleForecastWeek,
      forecastPage, forecastWeekPageCount, forecastWeekPageItems, forecastChangePage,
      forecastShowAll, toggleForecastShowAll,
      riskLabel, riskClass, sourceLabel, priorityLabel,
      forcedInput, forcedNote, forcedPriorityList, addForcedTerminals, removeForcedTerminal,
      replacementExclusionLabel, isExcludedFromReplacement,
      importStatus, onFileUpload, downloadDatasetJSON, downloadExcel,
      gitCmdCopied, copyGitCommand, gitDropActive, gitExportFiles, gitExportHistory,
      onGitExportSelect, onGitExportDrop, downloadGitExportFile, redownloadGitExportHistory, importGitExportFile,
      locationMeta, auditLocationOrder, locationGroup, auditFlags, latestRemark, allRemarks,
      auditDate, auditOperator, auditSearch, auditCategoryFilter, auditLocationFilter, auditOnlyPending,
      auditRecords, getAuditRecord, toggleAuditCheck, updateAuditNote, clearAuditForDate,
      auditFilteredTerminals, auditGrouped, auditSummary, exportAuditExcel,
    };
  }
}).mount('#app');
</script>
</body>
</html>
